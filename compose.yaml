# Full local stack in one command:
#   docker compose up -d --build
#   python3 scripts/seed-demo.py
#   docker compose --profile quality up -d   # optional SonarQube + Nexus
#
# Observability (Zipkin, Prometheus, Loki/Promtail, Grafana) and the Axon
# Server event store are part of the default profile so a plain
# `docker compose up -d` produces a complete demo.
# The heavyweight quality tools are opt-in via the `quality` profile.
# The host-based flow in scripts/run-stack.sh is unchanged; stop it first
# because the published ports are the same.

name: achat

x-java-build: &java-build
  context: .
  dockerfile: docker/Dockerfile.java

x-observability-env: &observability-env
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  TRACING_EXPORT_ENABLED: "true"

services:
  # ---------------------------------------------------------------- storage
  mysql:
    image: mysql:8.4
    container_name: achat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${DB_PASSWORD:-root} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [achat]

  # --------------------------------------------------------------- event store
  axon-server:
    image: axoniq/axonserver:2026.1.8
    container_name: achat-axon-server
    environment:
      AXONIQ_AXONSERVER_NAME: achat-axon-server
      AXONIQ_AXONSERVER_HOSTNAME: axon-server
      # Axon Server 2026.x no longer creates a "default" context on a fresh
      # data directory. Standalone mode creates it automatically so clients
      # using the default context can connect out of the box.
      AXONIQ_AXONSERVER_STANDALONE: "true"
    ports:
      - "8024:8024" # Admin UI / REST API
      - "8124:8124" # gRPC (commands and events)
    volumes:
      - axon-server-data:/data
    networks: [achat]

  # ---------------------------------------------------------- infrastructure
  config-server:
    build:
      <<: *java-build
      args:
        MODULE: infrastructure/config-server
    container_name: achat-config-server
    environment:
      <<: *observability-env
      CONFIG_SERVER_PORT: 8888
      CONFIG_REPO_DIR: file:/config-repo/
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks: [achat]

  discovery-server:
    build:
      <<: *java-build
      args:
        MODULE: infrastructure/discovery-server
    container_name: achat-discovery-server
    environment:
      <<: *observability-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
    networks: [achat]

  api-gateway:
    build:
      <<: *java-build
      args:
        MODULE: infrastructure/api-gateway
    container_name: achat-api-gateway
    environment:
      <<: *observability-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      API_GATEWAY_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks: [achat]

  # -------------------------------------------------------- business services
  product-service:
    build:
      <<: *java-build
      args:
        MODULE: product-service
    container_name: achat-product-service
    environment:
      <<: *observability-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      PRODUCT_SERVICE_PORT: 8082
      PRODUCT_DB_URL: "jdbc:mysql://mysql:3306/product_db?createDatabaseIfNotExist=true&serverTimezone=UTC"
      PRODUCT_DB_USERNAME: ${DB_USERNAME:-root}
      PRODUCT_DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks: [achat]

  inventory-service:
    build:
      <<: *java-build
      args:
        MODULE: inventory-service
    container_name: achat-inventory-service
    environment:
      <<: *observability-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      INVENTORY_SERVICE_PORT: 8083
      INVENTORY_DB_URL: "jdbc:mysql://mysql:3306/inventory_db?createDatabaseIfNotExist=true&serverTimezone=UTC"
      INVENTORY_DB_USERNAME: ${DB_USERNAME:-root}
      INVENTORY_DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks: [achat]

  supplier-service:
    build:
      <<: *java-build
      args:
        MODULE: supplier-service
    container_name: achat-supplier-service
    environment:
      <<: *observability-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SUPPLIER_SERVICE_PORT: 8084
      SUPPLIER_DB_URL: "jdbc:mysql://mysql:3306/supplier_db?createDatabaseIfNotExist=true&serverTimezone=UTC"
      SUPPLIER_DB_USERNAME: ${DB_USERNAME:-root}
      SUPPLIER_DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks: [achat]

  user-service:
    build:
      <<: *java-build
      args:
        MODULE: user-service
    container_name: achat-user-service
    environment:
      <<: *observability-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      USER_SERVICE_PORT: 8085
      USER_DB_URL: "jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&serverTimezone=UTC"
      USER_DB_USERNAME: ${DB_USERNAME:-root}
      USER_DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks: [achat]

  procurement-service:
    build:
      <<: *java-build
      args:
        MODULE: procurement-service
    container_name: achat-procurement-service
    environment:
      <<: *observability-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      PROCUREMENT_SERVICE_PORT: 8086
      PROCUREMENT_DB_URL: "jdbc:mysql://mysql:3306/procurement_db?createDatabaseIfNotExist=true&serverTimezone=UTC"
      PROCUREMENT_DB_USERNAME: ${DB_USERNAME:-root}
      PROCUREMENT_DB_PASSWORD: ${DB_PASSWORD:-root}
      AXON_AXONSERVER_ENABLED: "true"
      AXON_AXONSERVER_SERVERS: axon-server:8124
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      axon-server:
        condition: service_started
    networks: [achat]

  payment-service:
    build:
      <<: *java-build
      args:
        MODULE: payment-service
    container_name: achat-payment-service
    environment:
      <<: *observability-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      PAYMENT_SERVICE_PORT: 8087
      PAYMENT_DB_URL: "jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&serverTimezone=UTC"
      PAYMENT_DB_USERNAME: ${DB_USERNAME:-root}
      PAYMENT_DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8087/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks: [achat]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: achat-frontend
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [achat]

  # ------------------------------------------------------------ observability
  zipkin:
    image: openzipkin/zipkin:3.6
    container_name: achat-zipkin
    ports:
      - "9411:9411" # Zipkin UI + /api/v2/spans collector
    networks: [achat]

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: achat-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [achat]

  loki:
    image: grafana/loki:3.6.22
    container_name: achat-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [achat]

  promtail:
    image: grafana/promtail:3.6.11
    container_name: achat-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [achat]

  grafana:
    image: grafana/grafana:12.4.15
    container_name: achat-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/achat-overview.json
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - zipkin
    networks: [achat]

  # --------------------------------------------- optional quality profile
  sonar-db:
    image: postgres:16-alpine
    container_name: achat-sonar-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: [quality]
    networks: [achat]

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: achat-sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    depends_on:
      sonar-db:
        condition: service_healthy
    profiles: [quality]
    networks: [achat]

  nexus:
    image: sonatype/nexus3:3.97.3
    container_name: achat-nexus
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1200m"
    volumes:
      - nexus-data:/nexus-data
    ports:
      - "8081:8081"
    profiles: [quality]
    networks: [achat]

volumes:
  mysql-data:
  axon-server-data:
  prometheus-data:
  loki-data:
  grafana-data:
  sonar-db-data:
  nexus-data:

networks:
  achat:
