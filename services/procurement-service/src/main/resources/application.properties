spring.application.name=procurement-service
spring.config.import=${CONFIG_SERVER_IMPORT:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}
server.port=${PROCUREMENT_SERVICE_PORT:8086}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

# CQRS / Axon. The host-based run and tests use the embedded (in-memory) buses;
# Docker Compose points procurement-service at the axon-server container.
axon.axonserver.enabled=${AXON_AXONSERVER_ENABLED:false}
axon.axonserver.servers=${AXON_AXONSERVER_SERVERS:localhost:8124}
# Events and commands are Java records; XStream (Axon's default) cannot reflect
# on record components, so use Jackson for both the event store and messages.
axon.serializer.events=jackson
axon.serializer.general=jackson
# Subscribe processor keeps the projector synchronous so a query that follows
# a command immediately sees the produced event.
axon.eventhandling.processors.invoiceProjection.mode=subscribing
springdoc.swagger-ui.path=/swagger-ui.html
