name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: Maven · ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - backend
          - infrastructure
          - product-service
          - inventory-service
          - supplier-service
          - user-service
          - procurement-service
          - payment-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # Every module uses the same wrapper. Cache its distribution and retry
      # the download so a transient Maven Central failure does not fail CI.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('**/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Prime Maven wrapper
        working-directory: ${{ matrix.module }}
        run: |
          for attempt in 1 2 3; do
            if ./mvnw -v; then exit 0; fi
            echo "Maven wrapper download failed (attempt $attempt); retrying"
            sleep 5
          done
          echo "Could not download the Maven distribution"
          exit 1

      - name: Verify ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --watch=false
