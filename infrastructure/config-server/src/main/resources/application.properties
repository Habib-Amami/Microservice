spring.application.name=config-server
server.port=${CONFIG_SERVER_PORT:8888}

# Native mode: serve configuration files directly from the local config-repo
# folder. No nested Git repository is required. The default path is relative to
# the working directory, so start Config Server from infrastructure/config-server.
spring.profiles.active=${CONFIG_SERVER_PROFILES:native}
spring.cloud.config.server.native.searchLocations=${CONFIG_REPO_DIR:file:../../config-repo/}
