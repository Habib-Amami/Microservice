spring.application.name=config-server
server.port=${CONFIG_SERVER_PORT:8888}

# Native mode: serve configuration files directly from the local config-repo
# folder. No nested Git repository is required. The default path is relative to
# the working directory, so start Config Server from infrastructure/config-server.
spring.profiles.active=${CONFIG_SERVER_PROFILES:native}
spring.cloud.config.server.native.searchLocations=${CONFIG_REPO_DIR:file:../../config-repo/}

# Observability (Prometheus scraping + health probes) for the Config Server
# itself. Config Server is not a config client, so these live here rather than
# in config-repo/application.yml.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=config-server
management.otlp.metrics.export.enabled=false
# Spring Boot 4 Zipkin properties (see config-repo/application.yml).
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
