# Promtail discovers Compose containers through the Docker socket and pushes
# their JSON log files to Loki, adding container/service labels so the Grafana
# "Container logs" panel can filter by application.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=achat"]
    relabel_configs:
      # Docker SD exposes the absolute path to the container's JSON log file.
      - source_labels: ['__meta_docker_container_log_path']
        target_label: '__path__'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - target_label: 'job'
        replacement: docker
    pipeline_stages:
      - json:
          expressions:
            log: log
      - labels:
          stream:
      - output:
          source: log
