global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Every Spring Boot application exposes /actuator/prometheus (see
# config-repo/application.yml). Container DNS names are stable Compose service
# names, so no host ports are involved.
scrape_configs:
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8888
          - discovery-server:8761
          - api-gateway:8080
          - product-service:8082
          - inventory-service:8083
          - supplier-service:8084
          - user-service:8085
          - procurement-service:8086
          - payment-service:8087

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
