platform:
  config-repo:
    status: available
    sample-value: safe-local-default
    message: "Hello from Config Server"

# Shared observability defaults for every config client (Discovery Server,
# Gateway and the six business services). Service-specific files extend the
# health configuration but keep the same endpoint exposure list.
#
# The OTLP exporter is opt-in: the host-based run (scripts/run-stack.sh) has no
# Jaeger instance, so tracing export is off by default. docker compose.yaml
# sets OTEL_TRACING_EXPORT_ENABLED=true and points the exporter at Jaeger.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: false
  # Spring Boot 4 renamed the OTLP tracing properties. The old
  # management.otlp.tracing.* keys are deprecated at ERROR level and, more
  # importantly, no longer create the ConnectionDetails bean that wires the
  # OTLP HttpSpanExporter, so spans were silently dropped.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    export:
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
