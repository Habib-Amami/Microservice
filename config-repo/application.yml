platform:
  config-repo:
    status: available
    sample-value: safe-local-default
    message: "Hello from Config Server"

# Shared observability defaults for every config client (Discovery Server,
# Gateway and the six business services). Service-specific files extend the
# health configuration but keep the same endpoint exposure list.
#
# The Zipkin exporter is opt-in: the host-based run (scripts/run-stack.sh) has
# no tracing server, so export is off by default. docker compose.yaml sets
# TRACING_EXPORT_ENABLED=true and points the exporter at the Zipkin container.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
