spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${PRODUCT_DB_USERNAME:root}
    password: ${PRODUCT_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            # 2s to connect, 5s to read -> a 5s response-time budget for the
            # synchronous inventory calls (assignment: slow-response failures).
            connectTimeout: 2000
            readTimeout: 5000

server:
  port: ${PRODUCT_SERVICE_PORT:8082}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Resilience4j policies for the Product -> Inventory calls.
# Applied by InventoryResilienceGateway via @Retry / @RateLimiter /
# @CircuitBreaker. maxAttempts includes the initial call, so 3 means
# "up to 3 attempts" with a 500 ms pause between them.
resilience4j:
  retry:
    instances:
      inventoryService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: false
        retryExceptions:
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$BadGateway
          - feign.FeignException$GatewayTimeout
          - feign.FeignException$InternalServerError
          - feign.RetryableException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - org.example.achat.product.application.StockNotFoundException
  ratelimiter:
    instances:
      inventoryService:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  circuitbreaker:
    instances:
      inventoryService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$BadGateway
          - feign.FeignException$GatewayTimeout
          - feign.FeignException$InternalServerError
          - feign.RetryableException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - org.example.achat.product.application.StockNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
